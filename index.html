<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Study App</title>
</head>
<body>
  <main class="app">
    <h1>Flashcards</h1>

    <div class="card" id="card">
      <p class="card-side" id="card-side">Question</p>
      <p class="card-text" id="card-text">Loading...</p>
    </div>

    <p class="counter" id="counter"></p>

    <div class="controls">
      <button type="button" id="flip-btn">Flip</button>
      <button type="button" id="next-btn">Next</button>
    </div>
  </main>
</body>
</html>
